services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudcost
      POSTGRES_USER: cloudcost
      POSTGRES_PASSWORD: cloudcost_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcost -d cloudcost"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [cloudcost_internal]

  api:
    build:
      context: ./backend
    environment:
      CLOUDCOST_DATABASE_URL: postgresql+psycopg://cloudcost:cloudcost_local_only@postgres:5432/cloudcost
      CLOUDCOST_DEMO_MODE: "true"
      CLOUDCOST_ALLOW_LIVE_SYNC: "false"
      CLOUDCOST_CORS_ORIGINS: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [cloudcost_internal]

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks: [cloudcost_internal]

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "9090:9090"
    networks: [cloudcost_internal]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_local_only
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    networks: [cloudcost_internal]

networks:
  cloudcost_internal:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
